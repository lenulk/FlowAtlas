<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Independent Message App</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f3f5f8;color:#233049;margin:0;padding:48px 20px}
    main{max-width:680px;margin:auto;background:white;padding:34px;border:1px solid #dce2eb;border-radius:14px}
    h1{margin-top:0}p{line-height:1.6;color:#5c6980}button{font:inherit;padding:12px 16px;margin:4px;border:1px solid #9aaec9;border-radius:8px;background:#e9f0fc;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fa;padding:18px;border-radius:8px;min-height:50px}a{color:#255d9b}
  </style>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <small>SEPARATE WEB APP · FLOWATLAS INTEGRATION FIXTURE</small>
    <h1>Message App</h1>
    <p>แอปนี้รันคนละโปรเซสกับ FlowAtlas และส่งเฉพาะข้อมูลเส้นทางการรันเข้าตัวรับหลักฐานในเครื่อง</p>
    <button data-name="view-message" data-method="GET" data-path="/api/message">ดูข้อความ</button>
    <button data-name="send-message" data-method="POST" data-path="/api/send">ส่งข้อความ</button>
    <button data-name="fail-message" data-method="POST" data-path="/api/fail">ทดลองบริการล้มเหลว</button>
    <pre id="result" role="status">เลือกการกระทำ</pre>
    <a id="graph-link" hidden>ดูแผนที่ใน FlowAtlas ↗</a>
  </main>
</body>
</html>
