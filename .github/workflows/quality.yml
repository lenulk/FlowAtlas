name: FlowAtlas quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22.23.3', '24.21.0']
    defaults:
      run:
        shell: pwsh
    env:
      FLOWATLAS_PLAYWRIGHT_PACKAGE: ${{ github.workspace }}/tools/qa/node_modules/playwright/package.json
      FLOWATLAS_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned QA tools
        run: npm ci --prefix tools/qa --ignore-scripts --no-audit --no-fund
      - name: Install pinned tracing runtime and warm offline package cache
        run: npm ci --ignore-scripts --no-audit --no-fund --cache reports/releases/npm-cache
      - name: Install Chromium
        run: node tools/qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Main regression
        env:
          FLOWATLAS_TEST_PURPOSE: CI main regression
        run: node scripts/run-tests.mjs
      - name: Isolated source regression
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI isolated source regression
        run: node scripts/run-tests.mjs scripts/source-check.mjs
      - name: Inspector browser journey and replay
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI Chromium inspector journey and replay
        run: node scripts/run-tests.mjs scripts/inspector-browser-check.mjs
      - name: Independent browser journey
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI Chromium independent browser journey
        run: node scripts/run-tests.mjs scripts/independent-browser-check.mjs
      - name: OpenTelemetry runtime and viewer
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI real HTTP traces and paired Chromium viewer
          FLOWATLAS_OTEL_BROWSER_CHECK: '1'
        run: node scripts/run-tests.mjs test/otel-runtime.test.mjs
      - name: Failed browser assertion report and cleanup
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI deliberate assertion reporting and owned fixture cleanup
        run: node scripts/run-tests.mjs scripts/otel-failure-check.mjs
      - name: Fixture load capture accounting (performance reported separately)
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI paired fixture load responses and capture accounting
        run: node scripts/run-tests.mjs scripts/benchmark-http-trace.mjs
      - name: Opt-in flush and storage timing (diagnostic run only)
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI opt-in numeric flush storage timing diagnostics
          FLOWATLAS_BENCHMARK_TIMING: '1'
        run: node scripts/run-tests.mjs scripts/benchmark-http-trace.mjs
      - name: Collector component cost (simulated replay only)
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI simulated collector component cost diagnostic
        run: node scripts/run-tests.mjs scripts/benchmark-collector-cost.mjs
      - name: Controlled collector commit order
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI accepted commit order under controlled concurrent upload reversal
          FLOWATLAS_COLLECTOR_COST_REORDER: '1'
        run: node scripts/run-tests.mjs scripts/benchmark-collector-cost.mjs
      - name: Component failure evidence retention
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI controlled rejected replay reports failure and retains evidence
        run: node scripts/run-tests.mjs scripts/collector-cost-failure-check.mjs
      - name: Controlled slow fsync shutdown reproduction
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI controlled slow fsync preserves deadline failure and durable reload
        run: node scripts/run-tests.mjs scripts/slow-fsync-check.mjs
      - name: Experimental journal format guards
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI experimental journal framing corruption and retention guards
        run: node scripts/run-tests.mjs scripts/durable-write-format-check.mjs
      - name: Isolated durable write comparison
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI isolated synthetic snapshot journal writes and exact replay
        run: node scripts/run-tests.mjs scripts/benchmark-durable-write.mjs
      - name: Actual SDK HTTP component cost
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI actual SDK HTTP count-only and controlled sink costs
        run: node scripts/run-tests.mjs scripts/benchmark-sdk-http.mjs
      - name: SDK cost configuration and rejected sink evidence
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI SDK cost configuration parity and rejected sink evidence
        run: node scripts/run-tests.mjs scripts/sdk-http-fixture-check.mjs scripts/sdk-http-failure-check.mjs
      - name: Short sustained reference smoke
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI short sustained reference smoke only, not 30-minute acceptance
          FLOWATLAS_SUSTAINED_DURATION_MS: '4000'
        run: node scripts/run-tests.mjs scripts/sustained-reference-check.mjs
      - name: Sustained reference failure retention
        if: ${{ !cancelled() }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI controlled sustained business response failure retention
        run: node scripts/run-tests.mjs scripts/sustained-reference-failure-check.mjs
      - name: Pack and install in disposable workspace
        id: package_install
        if: ${{ !cancelled() }}
        run: |
          New-Item -ItemType Directory -Path reports/releases -Force | Out-Null
          npm pack --pack-destination reports/releases --cache reports/releases/npm-cache --json > reports/releases/pack-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          $taskPack = Get-Content -Raw reports/releases/pack-result.json | ConvertFrom-Json
          if ($taskPack.files | Where-Object { $_.path -match '^(reports|data|apps|tools|node_modules|\.git)/' -or $_.path -eq 'flowatlas.config.json' }) { throw 'Private paths entered package' }
          if (-not ($taskPack.files | Where-Object { $_.path -eq 'npm-shrinkwrap.json' })) { throw 'Published dependency lock is missing' }
          $taskInstall = 'reports/storage/package-install'
          $taskArtifact = (Resolve-Path -LiteralPath ('reports/releases/' + $taskPack.filename)).Path
          npm install --prefix reports/storage/package-cache-warm --cache reports/releases/npm-cache --ignore-scripts --no-audit --no-fund $taskArtifact
          if ($LASTEXITCODE -ne 0) { throw 'Packed dependency cache preparation failed' }
          npm install --prefix $taskInstall --cache reports/releases/npm-cache --offline --ignore-scripts --no-audit --no-fund $taskArtifact
          if ($LASTEXITCODE -ne 0) { throw 'Offline package install failed' }
          $taskInstalledRoot = (Resolve-Path -LiteralPath ($taskInstall + '/node_modules/flowatlas-mvp')).Path
          New-Item -ItemType Directory -Path ($taskInstall + '/workspace') | Out-Null
          $taskWorkspace = (Resolve-Path -LiteralPath ($taskInstall + '/workspace')).Path
          node ($taskInstalledRoot + '/scripts/cli.mjs') --workspace $taskWorkspace demo
          if ($LASTEXITCODE -ne 0) { throw 'Installed demo failed' }
          "FLOWATLAS_INSTALLED_ROOT=$taskInstalledRoot" >> $env:GITHUB_ENV
          "FLOWATLAS_PACKAGE_WORKSPACE=$taskWorkspace" >> $env:GITHUB_ENV
      - name: Installed package journey and replay
        id: package_journey
        if: ${{ !cancelled() && steps.package_install.outcome == 'success' }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI offline installed package journey and replay
        run: node scripts/run-tests.mjs scripts/package-check.mjs
      - name: Installed HTTP trace preload and schema replay
        if: ${{ !cancelled() && steps.package_install.outcome == 'success' }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI installed package HTTP tracing and schema reload
          FLOWATLAS_TRACED_TOOL_ROOT: ${{ env.FLOWATLAS_INSTALLED_ROOT }}
        run: node scripts/run-tests.mjs test/otel-runtime.test.mjs
      - name: Uninstall and reinstall without changing workspace data
        id: package_reinstall
        if: ${{ !cancelled() && steps.package_journey.outcome == 'success' }}
        run: |
          $taskState = $env:FLOWATLAS_PACKAGE_WORKSPACE + '/data/actions/state.json'
          $taskBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath $taskState).Hash
          npm uninstall --prefix reports/storage/package-install --cache reports/releases/npm-cache --offline --ignore-scripts --no-audit --no-fund flowatlas-mvp
          if ($LASTEXITCODE -ne 0) { throw 'QA uninstall failed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $taskState).Hash -ne $taskBefore) { throw 'Workspace changed during uninstall' }
          $taskPack = Get-Content -Raw reports/releases/pack-result.json | ConvertFrom-Json
          $taskArtifact = (Resolve-Path -LiteralPath ('reports/releases/' + $taskPack.filename)).Path
          npm install --prefix reports/storage/package-install --cache reports/releases/npm-cache --offline --ignore-scripts --no-audit --no-fund $taskArtifact
          if ($LASTEXITCODE -ne 0) { throw 'QA reinstall failed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $taskState).Hash -ne $taskBefore) { throw 'Workspace changed during reinstall' }
      - name: Replay and capture after reinstall
        if: ${{ !cancelled() && steps.package_reinstall.outcome == 'success' }}
        env:
          FLOWATLAS_TEST_PURPOSE: CI workspace history after uninstall and reinstall
        run: node scripts/run-tests.mjs scripts/package-check.mjs
      - name: Save evidence including failed runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/tests/
            reports/vm/inspector-browser-*/
            reports/browser/independent-browser-*/
            reports/browser/otel-runtime-*/
            reports/benchmarks/
            docs/TEST-RUNS.md
            reports/releases/pack-result.json
